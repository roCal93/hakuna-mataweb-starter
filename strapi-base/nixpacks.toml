# Nixpacks config (Railway)
# Fixes common Strapi admin build failures where SWC native bindings are missing
# due to optional dependencies being omitted or the wrong Node version being used.
# pnpm is pinned to the exact version declared in package.json (packageManager).

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_OPTIONAL = "true"

[phases.setup]
nixPkgs = ["nodejs-22_x"]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.28.2 --activate",
  "pnpm --version"
]

[phases.install]
cmds = [
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm run build"
]

[start]
cmd = "pnpm start"
